services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scenecore
      POSTGRES_PASSWORD: scenecore
      POSTGRES_DB: scenecore_development
    ports:
      - "5433:5432"
    volumes:
      - scenecore_postgres_data:/var/lib/postgresql/data

volumes:
  scenecore_postgres_data:
    # Keep local development data outside the Compose project lifecycle.
    # In particular, `docker compose down -v` must not delete this volume.
    external: true
    name: scenecore_scenecore_postgres_data
