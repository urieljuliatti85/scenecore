# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

# solid_cable needs its own tables, which this app's single-database
# config/database.yml never creates. Nothing in the app uses Action Cable
# today (no channels, no broadcasts, no turbo_stream_from), so this is the
# async adapter rather than a broken one. Revisit when a real-time feature
# lands: that needs the `cable` connection added to database.yml first.
production:
  adapter: async
