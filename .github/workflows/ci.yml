name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scenecore
          POSTGRES_PASSWORD: scenecore
          POSTGRES_DB: scenecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://scenecore:scenecore@localhost:5432/scenecore_test
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      # System specs have their own job below: they're browser-driven and
      # flakier, so mixing them into this run would hide which layer failed
      # and would need the retry/evidence handling that job does.
      - name: Run tests
        run: bundle exec rspec --exclude-pattern "spec/system/**/*_spec.rb"

  # Separate job on purpose: system specs drive a real headless Chrome
  # browser, are slower, and are the ones most prone to flaking. Keeping
  # them out of `test` means a flake here doesn't mask a real failure
  # elsewhere, and this job can retry once and keep evidence when it does.
  system-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scenecore
          POSTGRES_PASSWORD: scenecore
          POSTGRES_DB: scenecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://scenecore:scenecore@localhost:5432/scenecore_test
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      # System specs drive a real browser, so they need the actual
      # compiled CSS present — app/assets/builds/tailwind.css is
      # gitignored and normally produced by `bin/dev`'s watcher, which
      # doesn't run here. Without this, pages render with no stylesheet
      # at all, silently passing any assertion that happens to rely on
      # Tailwind CSS (e.g. a `hidden` class) rather than an HTML
      # attribute to hide an element.
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      # band_member_invite_spec.rb runs on its own, after the rest. The one
      # confirmed property of its long-standing flake (see the comment at the
      # top of that file) is that it only reproduces when the whole system
      # suite runs in a single process — never alone, however many times it
      # is repeated. Splitting the run sidesteps it.
      #
      # This is mitigation, not a fix: the root cause is still unknown, and
      # the spec still runs and still has to pass. If it starts failing in
      # isolation too, that is new information and worth investigating rather
      # than retrying.
      - name: Run system specs
        run: |
          set -o pipefail

          run_with_retry() {
            local label="$1"
            shift

            if bundle exec rspec "$@"; then
              return 0
            fi

            # Save evidence from the first attempt before retrying: a second,
            # green run would overwrite these screenshots/log, destroying the
            # only record of what actually failed.
            mkdir -p tmp/first-attempt
            cp -r tmp/capybara tmp/first-attempt/ 2>/dev/null || true
            cp log/test.log "tmp/first-attempt/${label}-test.log" 2>/dev/null || true

            echo "::warning title=Flaky system test::${label} failed on the first attempt and was retried. Evidence is in the 'system-test-first-attempt' artifact. A green job with this warning is NOT a clean run."

            bundle exec rspec "$@"
          }

          run_with_retry "system-suite" spec/system --exclude-pattern "**/band_member_invite_spec.rb"
          run_with_retry "band-member-invite" spec/system/band_member_invite_spec.rb

      # Uploaded even when the job ends green: that's the case of a retry
      # that passed on the second attempt, the only one where the flake
      # leaves a trace worth keeping.
      - name: Keep evidence from a retried system test run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-first-attempt
          path: ${{ github.workspace }}/tmp/first-attempt
          if-no-files-found: ignore

      - name: Keep screenshots and server log from a failed system test run
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-screenshots
          path: |
            ${{ github.workspace }}/tmp/capybara
            ${{ github.workspace }}/log/test.log
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

